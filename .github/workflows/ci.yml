name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heissal
          POSTGRES_PASSWORD: heissal
          POSTGRES_DB: heissal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heissal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: heissal
      POSTGRES_PASSWORD: heissal
      POSTGRES_DB: heissal_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci_only_secret_change_me_0123456789abcdef
      BACKEND_CORS_ORIGINS: http://localhost:3000
      FIRST_SUPERUSER_EMAIL: admin@heissal.co.ke
      FIRST_SUPERUSER_PASSWORD: ChangeMe123!
      # Stopgap for a known, already-investigated runner bug (see the sandbox
      # step above and tests/test_document_pdf.py's ci_pdf_hang marker) --
      # remove once this runner's Chromium print-to-pdf hang is fixed.
      PDF_TESTS_KNOWN_TO_HANG: "true"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest images restrict unprivileged user namespaces (AppArmor)
      # since April 2024, which breaks headless Chromium's own sandbox for
      # every tool that relies on it, not just this one ("No usable sandbox!"
      # from its zygote host). This relaxes the runner's kernel setting so
      # Chromium can use its real sandbox as designed, rather than the app
      # running with --no-sandbox (which trades this one setting for a
      # standing security relaxation, and still hung on this runner's zygote
      # even with it set). `|| true`: a future runner image may drop the
      # setting entirely, and this step should degrade to a no-op, not break
      # CI on an unrelated image update.
      - name: Allow Chromium's own sandbox to work (unprivileged userns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: mypy (typecheck)
        run: uv run mypy app

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Seed
        run: uv run python -m app.db.seed

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (admin build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck admin
        run: pnpm --filter @heissal/admin typecheck
      - name: Build admin
        run: pnpm --filter @heissal/admin build
